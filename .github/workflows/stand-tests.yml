# Tests against a deployed stand: smoke (quick, first check after a deploy) and remote (API regression over HTTP).
# Run by hand from the Actions tab, or call it from a deploy workflow after the deploy is live.
name: stand-tests

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Address of the stand
        required: true
        default: https://loan-platform-qa-lab.onrender.com
      groups:
        description: Which tests to run
        required: true
        default: smoke | remote
        type: choice
        options:
          - smoke
          - remote
          - smoke | remote
  workflow_call:
    inputs:
      base_url:
        required: true
        type: string
      groups:
        required: false
        type: string
        default: smoke | remote

defaults:
  run:
    working-directory: starter

jobs:
  stand-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      # inputs go through environment variables, so nothing typed into the form is pasted into the script
      - env:
          BASE_URL: ${{ inputs.base_url }}
          TEST_GROUPS: ${{ inputs.groups }}
        run: >
          mvn -B test
          -Dgroups="$TEST_GROUPS" -DexcludedGroups=
          -Dlab.baseUrl="$BASE_URL"
          -Dlab.asyncTimeoutSeconds=30
          -Dsurefire.reportFormat=plain -Dsurefire.useFile=false
