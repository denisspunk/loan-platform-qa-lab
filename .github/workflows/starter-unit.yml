# Unit tests of the deployable service in starter/: the cheapest check, on every push and pull request.
name: starter-unit

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: starter

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test -Dgroups=unit -Dsurefire.reportFormat=plain -Dsurefire.useFile=false
