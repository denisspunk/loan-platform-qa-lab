# Delivery of the service: one commit, chosen once, promoted dev -> stage -> prod through quality gates.
#   gate 0: service-pyramid is green on main (this workflow starts only after that)
#   gate 1: smoke and the stand regression on dev
#   gate 2: smoke and the stand regression on stage
#   approval: the prod environment waits for a reviewer
#   gate 3: smoke on prod; if it fails, prod goes back to the commit it ran before
#
# Run by hand, `stop_at` shortens the chain from the tail: dev only, or dev and stage. It
# can never skip a stage from the head, so the promise holds — nothing reaches a stand
# without having passed the one below it. To put a commit straight on a stand and accept
# that no gate has run, use `direct-deploy`, which says so on its own run page.
name: delivery

on:
  workflow_run:
    workflows: [service-pyramid]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a commit on main to deliver
        required: true
      stop_at:
        description: How far to promote; the chain always starts at dev
        required: true
        default: prod
        type: choice
        options: [dev, stage, prod]

# one delivery at a time; a newer one waits instead of cancelling a deploy halfway
concurrency:
  group: delivery
  cancel-in-progress: false

jobs:
  select-commit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      stop_at: ${{ steps.commit.outputs.stop_at }}
    steps:
      - id: commit
        env:
          FROM_PYRAMID: ${{ github.event.workflow_run.head_sha }}
          FROM_INPUT: ${{ inputs.commit }}
          STOP_AT: ${{ inputs.stop_at }}
        run: |
          sha="${FROM_INPUT:-$FROM_PYRAMID}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $sha"; exit 1; }
          # the automatic trigger carries no inputs and always means the whole chain
          stop_at="${STOP_AT:-prod}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "stop_at=$stop_at" >> "$GITHUB_OUTPUT"
          echo "Delivering commit \`$sha\` as far as \`$stop_at\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: select-commit
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: dev
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-1-dev:
    needs: [select-commit, deploy-dev]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-dev.outputs.url }}
      groups: smoke | regression
      ref: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  # skipping the tail is safe: stage still cannot run unless dev deployed and gate 1 passed
  deploy-stage:
    needs: [select-commit, gate-1-dev]
    if: needs.select-commit.outputs.stop_at != 'dev'
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: stage
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-2-stage:
    needs: [select-commit, deploy-stage]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-stage.outputs.url }}
      groups: smoke | regression
      ref: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  # What prod runs before anything touches it. A job of its own, deliberately without
  # `environment: prod`, for two reasons: reading needs no approval, and the rollback has to know
  # this commit even when the deploy failed — a reusable workflow that fails passes on no outputs.
  prod-before:
    needs: [select-commit, gate-2-stage]
    if: needs.select-commit.outputs.stop_at == 'prod'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.live.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: live
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_PROD }}
        run: echo "commit=$(tools/render.sh live-commit "$SERVICE")" >> "$GITHUB_OUTPUT"

  # the prod environment has a required reviewer: the deploy waits until someone approves
  deploy-prod:
    needs: [select-commit, gate-2-stage, prod-before]
    if: needs.select-commit.outputs.stop_at == 'prod'
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: prod
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-3-prod:
    needs: [select-commit, deploy-prod]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-prod.outputs.url }}
      # readonly is the subset of the regression that opens no loan and takes no payment,
      # so prod gets a contract check after a release without being left any test data
      groups: smoke | readonly
      ref: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  # No environment here on purpose: a rollback must not wait for another approval.
  #
  # It also runs when the DEPLOY failed, not only when gate 3 did. A deploy that times out can
  # still go live afterwards, and then prod is serving a commit no gate has looked at while the
  # pipeline shows red and nobody is coming. Asking Render what prod is actually running keeps
  # that honest: a rejected approval or a cancelled deploy changed nothing, and this says so
  # instead of redeploying for no reason.
  rollback-prod:
    needs: [select-commit, prod-before, deploy-prod, gate-3-prod]
    if: >-
      always() && needs.prod-before.outputs.commit != '' &&
      (needs.deploy-prod.result == 'failure' || needs.gate-3-prod.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_PROD }}
          PREVIOUS: ${{ needs.prod-before.outputs.commit }}
          ATTEMPTED: ${{ needs.select-commit.outputs.commit }}
        run: |
          live=$(tools/render.sh live-commit "$SERVICE")
          if [[ "$live" == "$PREVIOUS" ]]; then
            echo "prod is still running $PREVIOUS: the deploy never took, nothing to roll back"
            echo "Prod was left on \`$PREVIOUS\`; no rollback was needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::warning::prod is running $live, which no gate has passed; rolling back to $PREVIOUS"
          tools/render.sh deploy "$SERVICE" "$PREVIOUS"
          {
            echo "### Rolled back"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| was attempting | \`${ATTEMPTED}\` |"
            echo "| found running | \`${live}\` |"
            echo "| rolled back to | \`${PREVIOUS}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
