# Delivery of the service: one commit, chosen once, promoted dev -> stage -> prod through quality gates.
#   gate 0: service-pyramid is green on main (this workflow starts only after that)
#   gate 1: smoke and remote API regression on dev
#   gate 2: smoke and remote API regression on stage
#   approval: the prod environment waits for a reviewer
#   gate 3: smoke on prod; if it fails, prod goes back to the commit it ran before
#
# Run by hand, `stop_at` shortens the chain from the tail: dev only, or dev and stage. It
# can never skip a stage from the head, so the promise holds — nothing reaches a stand
# without having passed the one below it. To put a commit straight on a stand and accept
# that no gate has run, use `direct-deploy`, which says so on its own run page.
name: delivery

on:
  workflow_run:
    workflows: [service-pyramid]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a commit on main to deliver
        required: true
      stop_at:
        description: How far to promote; the chain always starts at dev
        required: true
        default: prod
        type: choice
        options: [dev, stage, prod]

# one delivery at a time; a newer one waits instead of cancelling a deploy halfway
concurrency:
  group: delivery
  cancel-in-progress: false

jobs:
  select-commit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
      stop_at: ${{ steps.commit.outputs.stop_at }}
    steps:
      - id: commit
        env:
          FROM_PYRAMID: ${{ github.event.workflow_run.head_sha }}
          FROM_INPUT: ${{ inputs.commit }}
          STOP_AT: ${{ inputs.stop_at }}
        run: |
          sha="${FROM_INPUT:-$FROM_PYRAMID}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::not a full commit SHA: $sha"; exit 1; }
          # the automatic trigger carries no inputs and always means the whole chain
          stop_at="${STOP_AT:-prod}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "stop_at=$stop_at" >> "$GITHUB_OUTPUT"
          echo "Delivering commit \`$sha\` as far as \`$stop_at\`" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: select-commit
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: dev
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-1-dev:
    needs: [select-commit, deploy-dev]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-dev.outputs.url }}
      groups: smoke | remote
      ref: ${{ needs.select-commit.outputs.commit }}

  # skipping the tail is safe: stage still cannot run unless dev deployed and gate 1 passed
  deploy-stage:
    needs: [select-commit, gate-1-dev]
    if: needs.select-commit.outputs.stop_at != 'dev'
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: stage
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-2-stage:
    needs: [select-commit, deploy-stage]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-stage.outputs.url }}
      groups: smoke | remote
      ref: ${{ needs.select-commit.outputs.commit }}

  # the prod environment has a required reviewer: the deploy waits until someone approves
  deploy-prod:
    needs: [select-commit, gate-2-stage]
    if: needs.select-commit.outputs.stop_at == 'prod'
    uses: ./.github/workflows/deploy-stand.yml
    with:
      environment: prod
      commit: ${{ needs.select-commit.outputs.commit }}
    secrets:
      render_api_key: ${{ secrets.RENDER_API_KEY }}

  gate-3-prod:
    needs: [select-commit, deploy-prod]
    uses: ./.github/workflows/stand-tests.yml
    with:
      base_url: ${{ needs.deploy-prod.outputs.url }}
      groups: smoke
      ref: ${{ needs.select-commit.outputs.commit }}

  # no environment here on purpose: a rollback must not wait for another approval
  rollback-prod:
    needs: [deploy-prod, gate-3-prod]
    if: failure() && needs.deploy-prod.result == 'success' && needs.deploy-prod.outputs.previous != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE: ${{ vars.RENDER_SERVICE_PROD }}
          COMMIT: ${{ needs.deploy-prod.outputs.previous }}
        run: |
          echo "::warning::gate 3 failed on prod, rolling back to $COMMIT"
          tools/render.sh deploy "$SERVICE" "$COMMIT"
